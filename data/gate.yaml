# ═══════════════════════════════════════════════════════════════════════
# gate.yaml — 평가 게이트 통과 기준 (작업 17)
#
# 소유: 장영진
# 성격: "새 뱅크를 배포 후보로 넘길 것인가"의 단일 출처입니다.
#
# **코드에 박지 않는 이유**
#   이 값은 상황에 따라 바뀝니다. 라인마다 과검 한 건의 무게가 다르고,
#   같은 라인도 물량이 몰리는 시기에는 기준이 달라집니다. 코드에 박아 두면
#   바꿀 때마다 커밋이 필요하고, 나중에 왜 그 값인지 아무도 답하지 못합니다.
#
# **값마다 근거를 함께 적습니다.** 근거 없는 숫자는 심사에서 가장 먼저
#   지적받고, 우리 스스로도 반년 뒤에 못 지킵니다.
# ═══════════════════════════════════════════════════════════════════════

version: 1
owner: 장영진
updated: 2026-08-15

# ── 기본값 ─────────────────────────────────────────────────────────────
#
# 라인별 설정이 없으면 이 값을 씁니다.
defaults:
  #: 홀드아웃 검출률 하한. 고치려던 문제가 실제로 나아졌는가.
  #: 0.90 은 "열 건 중 아홉은 잡는다"이며, 미검 한 건의 비용이 큰 품질
  #: 검사에서 이보다 낮은 값을 통과로 부르기 어렵습니다.
  min_detection_rate: 0.90

  #: 홀드아웃 과검률 상한. 정상을 불량이라 하는 비율입니다.
  #: 과검은 재검사 공수로 바로 환산되므로 낮게 잡습니다. 0.05 는 스무 건에
  #: 한 건이며, 라인 사정에 따라 조여야 하는 값이라 아래에서 덮어씁니다.
  max_false_positive_rate: 0.05

  #: 분리도 하한. 임계값을 어디에 두든 정상과 결함이 갈리는가.
  #: 검출률·과검률은 특정 임계값에서의 값이라 임계값을 옮기면 흔들립니다.
  #: AUROC 는 임계값과 무관해서, 둘이 함께 있어야 "임계값을 잘 골라 통과한
  #: 것"과 "실제로 나아진 것"이 갈립니다.
  min_auroc: 0.85

  #: 섀도에서 **새로 놓치는** 건수 상한.
  #: 0 입니다. 혼입 이미지를 제거해 목표 결함은 잡게 됐는데 다른 것을 놓치기
  #: 시작하면 개선이 아닙니다. **품질 검사에서 새로 놓치는 것은 한 건도
  #: 감수하지 않는다**는 것이 이 과제의 입장이고, 이 값이 그 입장입니다.
  max_newly_missed: 0

  #: 이전보다 나아져야 하는가. 같으면 바꿀 이유가 없습니다.
  require_improvement: true

  #: 재현성 확인 반복 횟수.
  #: 같은 입력에 판정이 흔들리면 게이트를 몇 번 돌려 통과할 때까지 재시도하는
  #: 일이 생깁니다. 그러면 게이트가 아닙니다.
  reproducibility_runs: 10

# ── 라인별 ─────────────────────────────────────────────────────────────
#
# **적은 항목만 덮어씁니다.** 안 적은 것은 위 defaults 를 그대로 씁니다.
# 값을 라인마다 복사해 두지 않는 이유는, 그러면 defaults 를 고칠 때 네 곳을
# 함께 고쳐야 하고 한 곳을 빠뜨리면 조용히 갈리기 때문입니다.
#
# **지금은 네 라인이 전부 같은 값을 씁니다.** 다르게 둘 근거가 아직 없습니다 —
# 라인별 재검사 인력이나 과검 비용을 확인하지 못했습니다. **근거 없이 다른
# 숫자를 넣으면 왜 다른지 아무도 설명하지 못하고, 그것은 자리표시와 같습니다.**
#
# 근거가 생기면 아래 해당 라인에 그 항목만 적고 `근거:` 를 함께 남기세요.
lines:
  line_01: {}   # pcb1
  line_02: {}   # pcb2
  line_03: {}   # pcb3
  line_04: {}   # pcb4

  # 적는 방법 —
  #
  # line_01:
  #   max_false_positive_rate: 0.03
  #   근거: 재검사 인력이 다른 라인의 절반이라 과검 한 건의 비용이 두 배
