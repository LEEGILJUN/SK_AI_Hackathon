        original_threshold: 0.42
        evaluation_threshold: 0.50
        note: "초기 Threshold 설정시 정상 스코어 상위 극단값 기준으로 과도하게 보수적으로(높게) 설정"
 
    ground_truth:
      intake_verdict: proceed
      cause: threshold
      requires_bank_rebuild: false
      duplicate_of: null
      evidence:
        defect_visible: true
        quality_within_baseline: true
        score_vs_threshold: below
        score_ratio: 0.89
        nearest_patch_ref:
          source_image: pcb1/Data/Images/Normal/0231.JPG
          patch_index: null
        nearest_patch_is_defect: false
        coverage_present: true
        criteria_verdict: defect
      expected_actions: [threshold_recalibration, roc_pr_reanalysis, shadow_compare]
      forbidden_actions: [rebuild_bank]
 
    scoring:
      weight: 1.0
      cause_match: exact
      grade_evidence: true
      evidence_required: [score_vs_threshold, score_ratio]
      tolerance: {score_ratio: 0.10}
      notes: >
        score_ratio 0.89로 threshold 바로 아래. 최근접 패치는 진짜 정상품이고(nearest_patch_is_defect:false)
        커버리지도 존재(coverage_present:true) — 재구성 사유가 전혀 없다. threshold 재산출만이 정답.
 
