# ═══════════════════════════════════════════════════════════════════════
# criteria.yaml — 판정 기준 테이블 (스키마 초안)
#
# 소유: 도메인 담당
# 성격: 판정 기준의 단일 출처. 판별 항목 7번 "판정 기준상 불량이 맞는가"를
#       대조하는 테이블입니다.
#
# 현재 상태: 필드 정의와 예시 1건만 담긴 골격입니다.
#
# 왜 이력(effective_from/to)이 필요한가
#   "기준 문제" 시나리오는 마스크 면적 임계값을 도중에 바꿔서 만듭니다.
#   과거 이슈를 다시 조회할 때 그 시점의 기준으로 판정해야 하므로,
#   기준은 덮어쓰지 않고 버전을 쌓습니다.
# ═══════════════════════════════════════════════════════════════════════

version: 1
owner: 도메인 담당
updated: 2026-08-12

# ── 단위와 판정 축 ─────────────────────────────────────────────────────
units:
  area: pixel                    # 마스크 면적 단위. 실치수 환산은 하지 않습니다
  length: pixel

verdicts:
  - defect                       # 불량
  - pass                         # 양품
  - review                       # 사람 확인 필요 (경계 구간)

# 규칙이 없는 조합에 적용할 기본값.
# 조용히 pass 로 흘리면 "기준 문제"가 사고로 보이지 않게 되므로 review 로 둡니다.
defaults:
  verdict_when_no_rule: review
  match_order: [line, object, zone, defect_type]   # 좁은 규칙이 우선

# ═══════════════════════════════════════════════════════════════════════
# 판정 규칙
#   matcher 로 대상을 좁히고, thresholds 로 면적을 판정합니다.
#   id 규칙: CR-<라인>-<일련번호>
# ═══════════════════════════════════════════════════════════════════════
rules:

  # ───────────────────────────────────────────────────────────────────
  # 예시 1건 — 아래 형식을 그대로 복제해 나머지를 채웁니다.
  # ───────────────────────────────────────────────────────────────────
  - id: CR-L02-001
    description: 캡슐 표면 찍힘 — 면적 기준

    # ── 적용 대상 ───────────────────────────────────────────────────
    # null 은 "모든 값에 적용"입니다. 좁은 규칙이 넓은 규칙을 덮습니다.
    matcher:
      line: line_02
      object: capsules
      zone: null                 # 영역 구분을 쓸 경우 A | B | ... , 안 쓰면 null
      defect_type: dent          # 결함 유형 코드

    # ── 면적 임계값 ─────────────────────────────────────────────────
    # 판정: area >= defect_area  → defect
    #       area >= review_area  → review
    #       그 미만               → pass
    # review_area 를 쓰지 않으려면 null 로 두고 2단 판정으로 씁니다.
    thresholds:
      defect_area: 150
      review_area: 90
      min_blob_area: 20          # 이보다 작은 연결 성분은 노이즈로 무시
      merge_gap: 3               # 이 픽셀 이내로 떨어진 blob 은 하나로 합산

    # ── 면적 산출 방식 ──────────────────────────────────────────────
    # 같은 마스크라도 어떻게 세느냐로 판정이 갈리므로 명시합니다.
    measurement:
      source: anomaly_mask       # anomaly_mask | gt_mask
      aggregate: largest_blob    # largest_blob | total_area

      # 뱅크에 자리별 기준선이 있을 때 쓰는 컷오프.
      #
      # 단위가 **자리별 변동 폭(MAD)의 배수** 입니다. "이 자리 평소 변동의
      # 몇 배인가"라서 품목이 달라도 뜻이 같고, 뱅크마다 새로 잡지 않아도
      # 됩니다.
      #
      # 3.0 은 이상치 판정에서 흔히 쓰는 값이며 **실측으로 확인된 값이
      # 아닙니다.** 정상·결함 이미지의 면적 분포를 재서 정해야 합니다.
      robust_cutoff: 3.0

      # 기준선이 **없는** 뱅크에서만 쓰는 옛 컷오프. 이상 점수 임계값에
      # 곱해 씁니다.
      #
      # **이 값으로 잰 면적은 판정 기준과 대조할 수 없습니다.** 정상부
      # 거리가 0 근처라는 가정인데 실측이 그렇지 않아(pcb1 정상 중앙 1.708,
      # capsules 2.251) 화면 전체가 결함으로 칠해집니다. 남겨 둔 것은 옛
      # 뱅크가 들어왔을 때 멈추지 않기 위해서일 뿐입니다.
      binarize_threshold: 0.5

    # ── 유효 기간 ───────────────────────────────────────────────────
    # to 가 null 이면 현재 유효한 규칙입니다.
    effective_from: 2026-06-01
    effective_to: null
    supersedes: null             # 이 규칙이 대체한 이전 규칙 ID

    # ── 근거 ────────────────────────────────────────────────────────
    rationale: >
      TODO(도메인 담당): 이 값이 나온 근거. 어떤 샘플을 보고 정했는지,
      현업 기준의 어느 항목에 대응하는지를 남깁니다.
      사내 결함 정의 체계나 실제 공정 기준은 적지 않습니다.

  # ───────────────────────────────────────────────────────────────────
  # TODO(도메인 담당): 라인 × 객체 × 결함유형 조합별 규칙
  #   "기준 문제" 시나리오용으로, 같은 matcher 에 대해
  #   effective_from 이 다른 규칙 2건을 쌓아 기준 변경 이력을 만듭니다.
  # ───────────────────────────────────────────────────────────────────
