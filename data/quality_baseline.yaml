# ═══════════════════════════════════════════════════════════════════════
# quality_baseline.yaml — 화질 지표 기준 분포 (스키마 초안)
#
# 소유: 도메인 담당 (지표 정의) · 데이터 담당 (분포 산출)
# 성격: 판별 항목 2번 "화질 지표가 기준 분포를 벗어났는가"의 대조 기준.
#       설비·광학 원인을 가르는 유일한 정량 근거입니다.
#
# 현재 상태: 필드 정의와 예시 1건만 담긴 골격입니다.
#            실제 값은 작업목록 8번(화질 지표 계산 및 기준 분포 산출)에서 채웁니다.
#
# 주의: 이 파일의 숫자는 사람이 정하는 값이 아니라 초기 뱅크 구간 이미지에서
#       계산해 나온 값입니다. 손으로 고치지 말고 산출 스크립트를 다시 돌립니다.
# ═══════════════════════════════════════════════════════════════════════

version: 1
owner: 도메인 담당
computed_by: 데이터 담당
updated: 2026-08-12

# ── 지표 정의 ──────────────────────────────────────────────────────────
# 무엇을 재는지와 어떻게 재는지를 여기서 한 번만 정의하고,
# baselines 에서는 값만 담습니다. 계산식이 바뀌면 version 을 올립니다.
metrics:
  - key: brightness
    label_ko: 밝기
    definition: 그레이스케일 변환 후 전체 픽셀 평균
    unit: "0-255"
    direction: two_sided          # two_sided | higher_is_worse | lower_is_worse

  - key: contrast
    label_ko: 대비
    definition: 그레이스케일 픽셀값 표준편차
    unit: "0-255"
    direction: lower_is_worse

  - key: sharpness
    label_ko: 선예도
    definition: 라플라시안 필터 응답의 분산 (variance of Laplacian)
    unit: arbitrary
    direction: lower_is_worse     # 낮아지면 블러. 설비·광학 케이스의 주 신호

  - key: noise
    label_ko: 노이즈
    definition: TODO(도메인 담당) — 산출식 확정 필요. 평탄 영역 국소 표준편차 등
    unit: arbitrary
    direction: higher_is_worse

# ── 이탈 판정 규칙 ─────────────────────────────────────────────────────
# 개별 이미지 1장으로는 판단하지 않습니다. 설비 문제는 어느 시점부터
# 지속되는 현상이므로, 구간 단위로 이탈을 판정합니다.
outlier_rule:
  method: zscore                  # zscore | percentile
  tolerance_sigma: 3.0            # |z| > 3.0 이면 해당 이미지를 이탈로 표시
  min_images: 20                  # 구간 판정에 필요한 최소 장수
  outlier_ratio_threshold: 0.30   # 구간 내 이탈 비율이 이 값을 넘으면 설비·광학 의심
  metrics_required: 1             # 몇 개 지표가 동시에 이탈해야 성립하는지

# ═══════════════════════════════════════════════════════════════════════
# 라인·객체별 기준 분포
#   초기 뱅크를 구성한 구간(1~4일분)에서 산출합니다.
#   운영 데이터 구간(5~7일분)은 절대 포함하지 않습니다. 여기에 열화를 주입하므로
#   섞이면 기준 자체가 오염되어 설비 문제를 못 잡습니다.
# ═══════════════════════════════════════════════════════════════════════
baselines:

  # ───────────────────────────────────────────────────────────────────
  # 예시 1건 — 아래 형식을 그대로 복제해 라인 수만큼 채웁니다.
  # ───────────────────────────────────────────────────────────────────
  - line: line_02
    object: capsules

    # ── 산출 근거 ───────────────────────────────────────────────────
    # 어느 이미지로 계산했는지가 남아야 재산출과 대조가 가능합니다.
    computed_from:
      date_range: [2026-06-01, 2026-06-04]
      split: normal_train          # 정상 학습셋만 사용
      n_images: 240
      manifest_ref: data/manifest.csv
      script: scripts/compute_quality_baseline.py
      seed: 20260601

    # ── 지표별 분포 ─────────────────────────────────────────────────
    # metrics 에 정의된 key 만 사용합니다.
    stats:
      brightness:
        mean: 128.4
        std: 6.2
        p01: 112.0
        p99: 145.0
      contrast:
        mean: 41.7
        std: 3.8
        p01: 32.1
        p99: 51.4
      sharpness:
        mean: 318.5
        std: 44.1
        p01: 210.0
        p99: 430.0
      noise:
        mean: 2.9
        std: 0.6
        p01: 1.8
        p99: 4.3

    # ── 개별 오버라이드 (선택) ──────────────────────────────────────
    # 라인 특성상 전역 규칙이 맞지 않을 때만 씁니다. 없으면 통째로 생략합니다.
    outlier_rule_override:
      sharpness:
        tolerance_sigma: 2.5

    notes: >
      TODO: 조명 조건이 일자별로 다르면 date_range 를 조건별로 쪼개
      baselines 엔트리를 나눕니다. 한 분포로 뭉개면 커버리지 부족과
      설비·광학이 구분되지 않습니다.

  # ───────────────────────────────────────────────────────────────────
