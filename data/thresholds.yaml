# ═══════════════════════════════════════════════════════════════════════
# thresholds.yaml — 운영 중인 이상 점수 임계값
#
# 소유: 장영진 (값)  ·  형식: 이길준
# 성격: 판별 항목 3번 "이상 점수가 임계값 대비 어느 위치인가"의 기준값.
#
# ── 왜 뱅크와 따로 두는가 ─────────────────────────────────────────────
#
# 임계값은 뱅크 파일 안에 들어 있지 않습니다. 같은 뱅크로도 운영 중에 값을
# 올리고 내립니다. 그래서 **어느 뱅크 버전에 대해 언제부터 쓰인 값인지**를
# 함께 남깁니다. 과거 이슈를 다시 볼 때 그 시점의 값으로 판정해야
# "임계값 문제"를 찾을 수 있습니다.
#
# ── 아래 값은 전부 자리표시입니다 ─────────────────────────────────────
#
# **TODO(장영진): 라인별 운영 임계값 확정 필요.**
#
# 2.20 은 `app/pipeline.py` 의 데모 기본값을 그대로 옮긴 것이고 근거가
# 없습니다. 실제로는 초기 캘리브레이션에서 정상 이미지 점수 분포를 보고
# 정하는 값이며, 그 근거를 note 에 남겨 주세요.
#
# 시나리오 쪽에는 이미 값이 있습니다 — `data/scenarios.yaml` 의
# threshold_shift 케이스가 `original_threshold` · `evaluation_threshold` 를
# 지정합니다. 그것과 어긋나지 않게 맞춰 주세요.
#
# bank_version 을 비우면 그 품목의 현행 값으로 봅니다. 값을 바꿀 때는
# 덮어쓰지 말고 `effective_from` 이 다른 줄을 쌓으세요.
# ═══════════════════════════════════════════════════════════════════════

